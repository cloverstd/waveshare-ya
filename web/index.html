<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YA · 蓝牙数据站</title><link rel="stylesheet" href="style.css">
<body><main><header><span class="mark">YA</span><div><p class="eyebrow">WAVESHARE · COMPANION</p><h1>让信息，轻轻抵达。</h1><p>发送文字，管理相册，查看设备日志。</p></div><span id="connection" class="badge">未连接</span></header>
<div class="toolbar"><label>设备名称（可选）<input id="device-name" placeholder="Waveshare-YA-XXXX" maxlength="24"></label><button id="connect">连接设备</button><button id="disconnect" class="secondary">断开</button><label><input id="auto" type="checkbox" checked> 自动重连</label><span id="activity">在设备开启蓝牙与两分钟配对窗口</span></div>
<div class="grid"><section><div class="section-title"><span>01 / 信息</span><h2>发送到设备</h2></div><label>文字<textarea id="note" placeholder="中文、生僻字、Emoji、多行文字……"></textarea></label><p class="hint">最多 1000 个字符。设备显示与下方预览一致；浏览器缺少的字形也会出现在预览中。最近一条信息在重启后保留。</p><button id="save-note">发送文字</button> <button id="cancel" class="secondary" disabled>取消</button><progress id="progress" value="0" max="100"></progress><p id="note-state" class="hint" aria-live="polite">未连接时可先暂存文字。</p><div class="preview"><canvas id="preview" width="432" height="62" aria-label="设备显示预览"></canvas></div></section>
<section><div class="section-title"><span>02 / 调试</span><h2>设备日志</h2></div><div class="toolbar"><button id="pull">拉取最近日志</button><label><input id="live" type="checkbox"> 实时接收</label><button id="download" class="secondary">下载文本</button></div><p id="log-state" class="hint">实时接收默认关闭；设备休眠或连接断开后停止。</p><pre id="device-log" aria-live="polite"></pre></section></div>
<section id="gallery-manager"></section>
<details><summary>连接诊断</summary><pre id="log"></pre></details><footer><span>需要 HTTPS 或 localhost，以及支持 Web Bluetooth 的 Chrome。</span><span>深睡期间蓝牙不可达。</span></footer></main><script type="module" src="app.mjs"></script></body></html>
