name: Deploy update website
on:
  push:
    branches: [main]
    paths: ['worker/**', 'web/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run check && npm test
        working-directory: worker
      - run: node --test tests/*.test.mjs
      - run: python3 tools/check_public.py --tracked
      - name: Deploy Worker and static assets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Secrets'; exit 1; }
          npm run deploy
      - name: Check public endpoints
        run: |
          curl --fail --retry 3 https://ya.cloverstd.com/ -o /dev/null
          curl --fail --retry 3 https://ya.cloverstd.com/companion/ -o /dev/null
          python3 tools/check_update.py
