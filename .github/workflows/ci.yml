name: Check and release firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run check && npm test
        working-directory: worker
      - run: node --test tests/*.test.mjs
      - run: python3 tools/check_public.py --tracked
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YA_BUILD_DIR: build-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          v = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', v)
          assert len(v) <= 31 and os.environ['GITHUB_REF_NAME'] == 'v' + v
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Prepare existing production signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
        run: |
          umask 077
          mkdir -p private/keys
          python3 - <<'PY'
          import os, pathlib
          key = os.environ['OTA_SIGNING_KEY_PEM']
          if not key: raise SystemExit('OTA_SIGNING_KEY_PEM is not configured')
          pathlib.Path('private/keys/ota-signing.pem').write_text(key)
          PY
          openssl pkey -in private/keys/ota-signing.pem -pubout -out private/keys/derived.pub
          cmp docs/ota-signing.pub private/keys/derived.pub
      - name: Install pinned ESP-IDF
        env:
          YA_REQUIRE_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake libusb-1.0-0
          ./tools/bootstrap.sh
      - run: ./tools/build_release.sh
      - run: .tools/venv/bin/python -m pytest -q tests
      - name: Package and verify release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          .tools/venv/bin/python tools/export_artifacts.py --build build-release --out artifacts/publish --notes 'Workers 在线更新、GitHub 自动构建发布与源码脱敏'
          GH_TOKEN="${{ github.token }}" .tools/venv/bin/python tools/delta_release.py artifacts/publish --github-bases
          .tools/venv/bin/python tools/verify_release.py artifacts/publish --tag "$GITHUB_REF_NAME" --provenance
          .tools/venv/bin/python tools/check_public.py --tracked --artifacts artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-assets
          path: artifacts/publish/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f private/keys/ota-signing.pem private/keys/derived.pub
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts/publish
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts/publish
          sha256sum --check SHA256SUMS
          python3 ../../tools/check_public.py --artifacts .
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/ya-release-draft; then
            test "$(cat /tmp/ya-release-draft)" = true || { echo 'Published releases cannot be replaced'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "YA $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" ./* --clobber
          mkdir /tmp/ya-release-verify
          gh release download "$GITHUB_REF_NAME" --dir /tmp/ya-release-verify
          (cd /tmp/ya-release-verify && sha256sum --check SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
